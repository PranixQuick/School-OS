name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Phase 0.2 — the E2E step below was gated with
      #   if: github.event_name == 'pull_request' && secrets.NEXT_... != ''
      # The `secrets` context is NOT available in a step-level `if:`. It IS
      # available in job-level `env:`. Hoisting it here makes the gate actually
      # evaluate, and makes the decision visible in the run log rather than
      # silently deciding whether the suite runs at all.
      HAS_SUPABASE_SECRETS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run lint
        run: npm run lint
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key_at_least_20_chars' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder_service_key_at_least_20_chars' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'placeholder_session_secret_32chars_min' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder-for-ci-lint-only' }}

      - name: Create test output directory
        run: mkdir -p test-results

      - name: Run unit tests
        run: npm run test:unit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key_at_least_20_chars' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder_service_key_at_least_20_chars' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'placeholder_session_secret_32chars_min' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder-for-ci-lint-only' }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build Next.js app (PR validation only)
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key_at_least_20_chars' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder_service_key_at_least_20_chars' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'placeholder_session_secret_at_least_32_chars' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder-for-ci-build-only' }}
          WHATSAPP_PROVIDER: twilio
          TWILIO_ACCOUNT_SID: placeholder_twilio_account_sid
          TWILIO_AUTH_TOKEN: placeholder_twilio_auth_token
          TWILIO_WHATSAPP_FROM: whatsapp:+1234567890

      # Blocking gate. Path-filtered on purpose: e2e/ is the established suite,
      # and tests/smoke.spec.ts is a spec recovered in Phase 0.1 that needs no
      # credentials. The other recovered orphans run non-blocking below until
      # they have been triaged.
      #
      # E2E_BYPASS_SECRET is legitimate here because this targets localhost.
      # lib/rate-limit.isE2EBypass() hard-refuses the bypass whenever
      # VERCEL_ENV === 'production', which is never true in CI.
      - name: Run E2E tests against local build (PR gate)
        if: github.event_name == 'pull_request' && env.HAS_SUPABASE_SECRETS == 'true'
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
          npx playwright test e2e tests/smoke.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          TEST_PARENT_PHONE: '9515479595'
          TEST_PARENT_PIN: ${{ secrets.TEST_PARENT_PIN }}
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          TEST_BASE_URL: http://localhost:3000

      # SEC-CRITICAL-3. This step used to run the FULL E2E suite against
      # production with E2E_BYPASS_SECRET in its environment. That is what
      # forced the login bypass to be configured on the production deployment:
      # one static, never-rotated string that minted a full-privilege session
      # for any account in any tenant, ahead of rate limiting.
      #
      # It now runs only tests/smoke.spec.ts, which authenticates as nobody.
      # No credential is sent to production. Anything requiring a login belongs
      # on the PR gate above, against a local build.
      - name: Post-deploy smoke against production (unauthenticated only)
        if: github.event_name == 'push'
        run: npx playwright test tests/smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          # Deliberately absent: E2E_BYPASS_SECRET, TEST_ADMIN_PASSWORD,
          # TEST_TEACHER_PASSWORD, TEST_PARENT_PIN, SUPABASE_SERVICE_ROLE_KEY,
          # SESSION_SECRET. This job sends no credential of any kind to
          # production, so there is nothing here for a compromised runner to
          # take.

      # Phase 0.5 — leave provable evidence behind. Before this, nothing in the
      # repo proved any test had ever run on any date: test-results/.last-run.json
      # held 45 bytes with no date and no test list, and the evidence ledger was
      # an empty template.
      - name: Generate evidence record
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results
          {
            echo "# Test evidence - run ${{ github.run_id }}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Date (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Ref | ${{ github.ref }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| Job status | ${{ job.status }} |"
            echo
            echo "Artifacts: playwright-report/, test-results/e2e-junit.xml,"
            echo "test-results/unit-junit.xml, coverage/"
          } > test-results/EVIDENCE_RUN.md
          cat test-results/EVIDENCE_RUN.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 30

      - name: Upload Playwright report and trace/video artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload local test-results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 30
